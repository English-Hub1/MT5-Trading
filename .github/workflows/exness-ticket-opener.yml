name: Run MT5 Cycle on GitHub Runner

on:
  schedule:
    - cron: "50 20 * * *" # ~20:50 UTC (23:50 EAT)
  workflow_dispatch:

jobs:
  trade-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wine and Xvfb (Virtual Display)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y wine64 wine32 xvfb wget

      - name: Download & Setup MT5
        run: |
          wget -q https://mql5.com -O ~/mt5setup.exe
          xvfb-run -a wine ~/mt5setup.exe /auto || true

          # Wait up to 90s for mt5setup to finish installing terminal64.exe
          for i in $(seq 1 18); do
            FOUND=$(find ~/.wine ~/ -name "terminal64.exe" 2>/dev/null | head -n 1)
            if [ -n "$FOUND" ]; then
              echo "Found terminal64.exe at: $FOUND"
              break
            fi
            sleep 5
          done

          # Stop any auto-launched GUI instance from the installer so /config takes effect
          pkill -9 -f terminal64.exe || true
          sleep 2

      - name: Copy EA, Servers, and Generate mt5.ini
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          TERM_EXE=$(find ~/.wine ~/ -name "terminal64.exe" 2>/dev/null | head -n 1)
          if [ -z "$TERM_EXE" ]; then
            echo "ERROR: terminal64.exe was not found after installation!"
            exit 1
          fi

          MT5_DIR=$(dirname "$TERM_EXE")
          echo "Using MT5_DIR=$MT5_DIR"

          mkdir -p "$MT5_DIR/MQL5/Experts" "$MT5_DIR/Config"
          cp ImmediateBuy24h.ex5 "$MT5_DIR/MQL5/Experts/"
          cp servers.dat "$MT5_DIR/Config/"

          cat <<EOF > "$MT5_DIR/mt5.ini"
          [Common]
          Login=${MT5_LOGIN}
          Password=${MT5_PASSWORD}
          Server=Exness-MT5Real27
          KeepPrivate=1
          NewsEnable=0

          [Experts]
          AllowLiveTrading=1
          AllowDllImport=0
          Enabled=1

          [StartUp]
          Expert=ImmediateBuy24h
          Symbol=BTCUSDm
          Period=M1
          EOF

      - name: Launch MT5 and Execute Trade Cycle (Runs for 3 mins)
        run: |
          TERM_EXE=$(find ~/.wine ~/ -name "terminal64.exe" 2>/dev/null | head -n 1)
          MT5_DIR=$(dirname "$TERM_EXE")
          WIN_INI=$(winepath -w "$MT5_DIR/mt5.ini")
          echo "Launching $TERM_EXE with /config:$WIN_INI"
          timeout 180s xvfb-run -a wine "$TERM_EXE" /portable /config:"$WIN_INI" || true

      - name: Print MT5 Logs for Verification
        if: always()
        run: |
          TERM_EXE=$(find ~/.wine ~/ -name "terminal64.exe" 2>/dev/null | head -n 1)
          MT5_DIR=$(dirname "$TERM_EXE")
          echo "=== TERMINAL LOGS ==="
          for f in "$MT5_DIR/Logs/"*.log; do
            [ -f "$f" ] && (iconv -f UTF-16LE -t UTF-8 "$f" 2>/dev/null || cat "$f")
          done
          echo "=== EXPERT LOGS ==="
          for f in "$MT5_DIR/MQL5/Logs/"*.log; do
            [ -f "$f" ] && (iconv -f UTF-16LE -t UTF-8 "$f" 2>/dev/null || cat "$f")
          done
